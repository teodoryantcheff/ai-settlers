name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Format, typecheck and Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The package.json engines floor: Node tests rely on its built-in type stripping.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install
        run: npm ci
      # Format, lint, typecheck and Node tests run concurrently, each reporting its own failure.
      - name: Routine validation
        run: npm test
      - name: Upload validation logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-logs
          path: output/validation/
          if-no-files-found: ignore
          retention-days: 14

  # Full autoplay playthroughs run in parallel with routine validation.
  soak:
    name: Economy soak tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Install
        run: npm ci
      - name: Economy soak tests
        run: npm run test:soak
      - name: Upload validation logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-validation-logs
          path: output/validation/
          if-no-files-found: ignore
          retention-days: 14
